# AI Reminder Configuration Example
# Copy this to config.yaml and fill in your values

# Discord webhooks
discord:
  main_webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  debug_webhook_url: "https://discord.com/api/webhooks/YOUR_DEBUG_WEBHOOK_ID/YOUR_DEBUG_TOKEN"
  debug_level: "error"  # Options: debug, info, warning, error

# LLM Configuration
# Supported providers: openai, gemini, groq
llm:
  provider: "openai"  # Options: openai, gemini, groq
  api_key: "YOUR_API_KEY_HERE"
  model: "gpt-4"
  max_tokens: 350  # to prevent long outputs
  temperature: 0.9

  # Provider-specific settings (optional, uses defaults if not specified)
  openai:
    base_url: "https://api.openai.com/v1"
  gemini:
    base_url: "https://generativelanguage.googleapis.com"
  groq:
    base_url: "https://api.groq.com/openai/v1"

# Reminder settings
reminder:
  target_name: "Jane"
  sender_name: "John"
  book_title: "The Great Book"
  language: "Polish"         # Language for AI responses (e.g. Polish, English, German)
  target_gender: "female"    # Grammatical gender of target_name: "female" or "male"
                             # Used by the prompt to ensure correct grammatical forms.

  # Time settings
  randomize_time: true  # If true, randomize within time_range. If false, use exact time from time_range.start
  time_range:
    start: "14:00"  # If randomize_time is false, reminder sent at this exact time
    end: "17:00"    # Used only when randomize_time is true

# Cache settings
cache:
  cache_size: 10
  cache_dir: "cache"

# Logging settings
logging:
  log_dir: "logs"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  max_bytes: 10485760  # 10MB
  backup_count: 5

  # Console output settings
  console:
    enabled: true
    colored: true  # Enable colored output (requires colorama)

  # File output settings
  file:
    enabled: true
    include_timestamp: true
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"

# Prompt template
# Available placeholders: {sender_name}, {target_name}, {book_title},
#                         {language}, {target_gender}, {recent_messages}
prompt: |
  You remind {target_name} to read "{book_title}". Be casual and vary your messages.

  IMPORTANT: {target_name} is {target_gender}. Always use grammatically correct
  forms for a {target_gender} person (e.g. in Polish use feminine verb endings and
  adjectives when addressing or referring to {target_name}).

  Recent messages you sent:
  {recent_messages}

  Generate ONE SHORT different message (1-2 sentences). Don't repeat patterns from above.

  Mix it up:
  - Ask how it's going
  - Ask where she is in the book
  - You can, but don't do it all the time, include the name of the target: {target_name}
  - You can, but don't do it all the time, include the name of the person who programmed you: {sender_name}
  - Mention you're just checking in
  - Be brief and factual
  - Show mild interest
  - Assume {target_name} read {book_title} today

  Respond in {language}. Output only the message.