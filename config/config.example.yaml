# AI Reminder Configuration Example
# Copy this to config.yaml and fill in your values

# Discord webhooks
discord:
  main_webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
  debug_webhook_url: "https://discord.com/api/webhooks/YOUR_DEBUG_WEBHOOK_ID/YOUR_DEBUG_TOKEN"
  debug_level: "error"  # Options: debug, info, warning, error

# LLM Configuration
# Supported providers: openai, gemini, groq
llm:
  provider: "openai"  # Options: openai, gemini, groq
  api_key: "YOUR_API_KEY_HERE"
  model: "gpt-4"
  max_tokens: 350  # to prevent long outputs
  temperature: 0.9

  # Provider-specific settings (optional, uses defaults if not specified)
  openai:
    base_url: "https://api.openai.com/v1"
  gemini:
    base_url: "https://generativelanguage.googleapis.com"
  groq:
    base_url: "https://api.groq.com/openai/v1"

# Reminder settings
reminder:
  target_name: "Jane"
  sender_name: "John"
  book_title: "The Great Book"
  language: "Polish"         # Language for AI responses (e.g. Polish, English, German)
  target_gender: "female"    # Grammatical gender of target_name: "female" or "male"
                             # Used by the prompt to ensure correct grammatical forms.

  # Time settings
  randomize_time: true  # If true, randomize within time_range. If false, use exact time from time_range.start
  time_range:
    start: "14:00"  # If randomize_time is false, reminder sent at this exact time
    end: "17:00"    # Used only when randomize_time is true

  # Response window: how many hours after a sent reminder the bot will reply
  # to whatever the target writes back (e.g. "stfu", "ok ok", "przeczytałam").
  # Set to 0 to disable response-window mode entirely.
  # Default: 3
  response_window_hours: 3

# Cache settings
cache:
  cache_size: 10
  cache_dir: "cache"

# Logging settings
logging:
  log_dir: "logs"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  max_bytes: 10485760  # 10MB
  backup_count: 5

  # Console output settings
  console:
    enabled: true
    colored: true  # Enable colored output (requires colorama)

  # File output settings
  file:
    enabled: true
    include_timestamp: true
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"

# Prompt template
# --------------
# Instead of one prompt listing many possible things the message could do
# ("mix it up: ask X, or Y, or Z, ..."), the prompt is split into:
#   - "base": fixed instructions/context, with a {task} placeholder
#   - "tasks": a list of single-focus task variants
#
# For every generated message, Python (config_loader.py) picks ONE task at
# random and drops it into {task}. The LLM only ever has to do ONE clear
# thing per message, instead of choosing between several instructions and
# trying to satisfy all of them at once — which is what was causing garbled,
# illogical messages from gpt-oss-120b. Add/edit/remove task variants freely.
#
# Available placeholders in "base": {task}, {sender_name}, {target_name},
#   {book_title}, {language}, {target_gender}, {recent_messages}
# Available placeholders in each "tasks" entry: {sender_name}, {target_name},
#   {book_title}, {language}, {target_gender}, {recent_messages}
prompt:
  base: |
    You remind {target_name} to read "{book_title}". Be casual.
 
    IMPORTANT: {target_name} is {target_gender}. Always use grammatically correct
    forms for a {target_gender} person (feminine verb endings and adjectives
    when addressing or referring to {target_name}).
 
    Recent messages you sent:
    {recent_messages}
 
    Task for this message: {task}
 
    Generate ONE SHORT message (1-2 sentences) that does ONLY the task above.
    Don't repeat patterns from the recent messages listed above.
 
    Respond in {language}. Output only the message, nothing else.
 
  tasks:
    - "Ask how the reading is going."
    - "Ask what chapter {target_name} is on right now (remember: rozdziały, not odcinki)."
    - "Include {target_name}'s name, then ask a short question about the book."
    - "Mention that {sender_name} programmed you, then ask if {target_name} read today."
    - "Say you're a little bit bored with your job today, then briefly ask if {target_name} read anything."
    - "Be brief and purely factual: just ask whether today's reading happened."
    - "Show mild interest: ask what part of the story feels interesting right now."
    - "Assume {target_name} read {book_title} today and ask how far they got."